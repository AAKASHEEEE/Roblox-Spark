<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlockSpark Studio</title>
<style>
  :root{--bg:#0e1016;--panel:#171a23;--line:#2a2f3d;--text:#e9ecf3;--dim:#9aa3b5;--cyan:#19d3e6;--yellow:#ffd21a;--bad:#ff6b6b;--good:#5fe08a}
  *{box-sizing:border-box} [hidden]{display:none !important} body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:20px;padding:12px 22px;border-bottom:1px solid var(--line);background:#12151d}
  header h1{margin:0;font-size:19px;color:var(--cyan)} header .dev{margin-left:auto;color:var(--dim);font-size:13px}
  #steps{display:flex;gap:6px} #steps span{padding:4px 10px;border-radius:14px;background:var(--panel);color:var(--dim);font-size:13px}
  #steps span.on{background:var(--yellow);color:#111;font-weight:700}
  main{max-width:1180px;margin:0 auto;padding:18px 22px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim)}
  textarea,input,select{font:inherit;color:var(--text);background:#0f121a;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  textarea{width:100%;resize:vertical} .row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin:14px 0}
  button,.btn{font:inherit;font-weight:700;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block;background:#2a3040;color:var(--text)}
  .primary{background:var(--yellow);color:#111;font-size:16px;padding:12px 22px} .ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button:disabled{opacity:.35;cursor:not-allowed} .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .label{display:inline-block;margin:0 0 12px;padding:6px 10px;border-radius:8px;background:rgba(255,210,26,.12);color:var(--yellow);font-size:13px}
  .banner{margin:0 auto 12px;max-width:1180px;padding:10px 14px;border-radius:9px} .err{background:rgba(255,107,107,.14);color:var(--bad)}
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 18px;margin:10px 0 16px}
  .facts div{border-left:3px solid var(--cyan);padding-left:9px} .facts b{display:block;color:var(--dim);font-size:12px;font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .card{background:#10131b;border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:9px;padding:10px 12px;font-size:13.5px}
  .card .t{color:var(--yellow);font-weight:700} .card .t span{float:right;color:var(--dim);font-weight:400} .card .who{font-size:15px;font-weight:700;margin:3px 0}
  .card .purpose{color:var(--dim);margin-top:4px} .card .cue{color:var(--cyan);font-size:12.5px;margin-top:4px}
  .panel{border-radius:10px;padding:12px 16px;margin:10px 0} .panel h2{margin:0 0 6px;font-size:18px}
  .bad{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.4)} .good{background:rgba(95,224,138,.08);border:1px solid rgba(95,224,138,.35)}
  .dim{color:var(--dim)} .warn{color:var(--yellow)} h2{font-size:20px;margin:0 0 4px} pre{max-height:380px;overflow:auto;background:#0b0d12;padding:10px;border-radius:8px;font-size:12px}
  ol.stages{display:flex;gap:6px;list-style:none;padding:0;flex-wrap:wrap} ol.stages li{padding:5px 11px;border-radius:14px;background:#10131b;color:var(--dim);font-size:13px}
  ol.stages li.done{color:var(--good)} ol.stages li.on{background:var(--cyan);color:#111;font-weight:700} ol.stages li.bad{background:var(--bad);color:#111}
  progress{width:360px;height:14px;accent-color:var(--cyan)} .result{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
  video{height:min(72vh,640px);aspect-ratio:9/16;background:#000;border-radius:10px} table{border-collapse:collapse} td{padding:4px 14px 4px 0;border-bottom:1px solid var(--line)}
  #modes{display:flex;gap:4px} #modes button{padding:6px 12px;font-size:13px;background:var(--panel);color:var(--dim)} #modes button.on{background:var(--cyan);color:#111}
  #n-steps{display:flex;gap:6px;margin:0 0 12px} #n-steps span{padding:4px 10px;border-radius:14px;background:var(--panel);color:var(--dim);font-size:13px} #n-steps span.on{background:var(--yellow);color:#111;font-weight:700}
  td:first-child{color:var(--dim)} .remind{background:rgba(25,211,230,.1);color:var(--cyan);padding:9px 12px;border-radius:8px}
</style></head>
<body>
<header><h1 id="product">BlockSpark Studio</h1>
  <nav id="modes" aria-label="Mode"><button type="button" data-mode="visual" class="on">Visual Comedy</button><button type="button" data-mode="narrated">Narrated Story</button></nav>
  <nav id="steps"><span data-s="create">1 Idea</span><span data-s="storyboard">2 Storyboard</span><span data-s="approved">3 Approve</span><span data-s="render">4 Render</span></nav>
  <a class="dev" href="/apps/studio/player.html">developer episode player</a></header>
<div id="error" class="banner err" hidden></div>
<main>
<div id="mode-visual">
  <section id="create">
    <p class="label" id="label">Experimental constrained generator — review the storyboard before rendering.</p>
    <label>Idea<textarea id="idea" rows="4" maxlength="400"></textarea></label>
    <div class="row">
      <label>Comedy engine<select id="engine"></select></label>
      <label>Duration (seconds)<input id="duration" type="number" step="1" style="width:120px"></label>
      <label>Seed<input id="seed" type="number" min="0" step="1" style="width:150px"></label>
      <button id="newSeed" class="ghost" type="button">New seed</button>
    </div>
    <div class="actions"><button id="generate" class="primary">Generate Storyboard</button><span id="genStatus" class="dim"></span></div>
  </section>
  <section id="storyboard" hidden></section>
  <section id="approved" hidden></section>
  <section id="render" hidden></section>
</div>
<div id="mode-narrated" hidden>
  <nav id="n-steps"><span data-s="input">1 Script + voice-over</span><span data-s="alignment">2 Alignment review</span><span data-s="storyboard">3 Storyboard</span></nav>
  <p class="remind" id="n-notice"></p>
  <section id="n-input"></section>
  <section id="n-alignment" hidden></section>
  <section id="n-storyboard" hidden></section>
</div>
</main>
<script type="module" src="/dist/apps/studio/src/app.js"></script>
<script type="module" src="/dist/apps/studio/src/narrated.js"></script>
</body></html>
